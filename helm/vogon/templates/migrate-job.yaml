apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "vogon.fullname" . }}-migrate
  labels:
    {{- include "vogon.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "vogon.componentSelectorLabels" (dict "root" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - >-
              python manage.py migrate --noinput &&
              python manage.py shell -c "from django.contrib.sites.models import Site; Site.objects.update_or_create(pk=1, defaults={'domain': '{{ .Values.django.siteDomain }}', 'name': '{{ .Values.django.siteName }}'})"
          envFrom:
            - configMapRef:
                name: {{ include "vogon.configMapName" . }}
            - secretRef:
                name: {{ include "vogon.secretName" . }}
          {{- if or .Values.database.existingSecret.name .Values.extraEnv }}
          env:
            {{- if .Values.database.existingSecret.name }}
            - name: DJANGO_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "vogon.dbSecretName" . }}
                  key: {{ .Values.database.existingSecret.userKey | quote }}
            - name: DJANGO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "vogon.dbSecretName" . }}
                  key: {{ .Values.database.existingSecret.passwordKey | quote }}
            {{- end }}
            {{- range .Values.extraEnv }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
