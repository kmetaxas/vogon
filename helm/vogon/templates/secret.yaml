{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vogon.secretName" . }}
  labels:
    {{- include "vogon.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
type: Opaque
stringData:
  DJANGO_SECRET_KEY: {{ .Values.secret.djangoSecretKey | quote }}
  {{- if not .Values.database.existingSecret.name }}
  DJANGO_DB_PASSWORD: {{ .Values.secret.djangoDbPassword | quote }}
  {{- end }}
  LLM_API_KEY: {{ .Values.secret.llmApiKey | quote }}
  PROMETHEUS_AUTH_TOKEN: {{ .Values.secret.prometheusAuthToken | quote }}
  EMBEDDING_API_KEY: {{ .Values.secret.embeddingApiKey | quote }}
  EMAIL_HOST_PASSWORD: {{ .Values.email.password | quote }}
{{- end }}
