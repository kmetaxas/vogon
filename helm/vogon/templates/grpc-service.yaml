apiVersion: v1
kind: Service
metadata:
  name: {{ include "vogon.fullname" . }}-grpc
  labels:
    {{- include "vogon.labels" . | nindent 4 }}
    app.kubernetes.io/component: grpc
spec:
  type: {{ .Values.grpc.service.type }}
  ports:
    - port: {{ .Values.grpc.service.port }}
      targetPort: grpc
      protocol: TCP
      name: grpc
      {{- if and (eq .Values.grpc.service.type "NodePort") .Values.grpc.service.nodePort }}
      nodePort: {{ .Values.grpc.service.nodePort }}
      {{- end }}
  selector:
    {{- include "vogon.componentSelectorLabels" (dict "root" . "component" "grpc") | nindent 4 }}
