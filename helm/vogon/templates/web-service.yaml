apiVersion: v1
kind: Service
metadata:
  name: {{ include "vogon.fullname" . }}-web
  labels:
    {{- include "vogon.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.web.service.type "NodePort") .Values.web.service.nodePort }}
      nodePort: {{ .Values.web.service.nodePort }}
      {{- end }}
  selector:
    {{- include "vogon.componentSelectorLabels" (dict "root" . "component" "web") | nindent 4 }}
