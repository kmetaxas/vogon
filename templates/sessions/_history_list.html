{% if sessions %}
<div class="session-list">
    {% for session in sessions %}
    <a href="{% url 'sessions:session-detail' session.id %}" class="session-item">
        <div>
            <div class="session-item-title">{{ session.title }}</div>
            <div class="session-item-meta">{{ session.updated_at|timesince }} ago &middot; {{ session.get_status_display }}</div>
        </div>
    </a>
    {% endfor %}
</div>
{% else %}
<p class="empty-state">No previous troubleshootings.</p>
{% endif %}
