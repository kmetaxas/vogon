{% if personalities %}
<div class="personality-picker">
    {% for p in personalities %}
    <div class="personality-picker-item" data-personality-id="{{ p.id }}" data-personality-name="{{ p.name }}">
        <span class="personality-picker-name">{{ p.name }}</span>
        <span class="personality-picker-meta">
            {% if p.category %}<span class="personality-picker-category">{{ p.category }}</span>{% endif %}
            {% if p.scope == 'system' %}<span class="badge badge-secondary">System</span>{% endif %}
        </span>
    </div>
    {% endfor %}
</div>
{% else %}
<p class="text-muted">No personalities available.</p>
{% endif %}
