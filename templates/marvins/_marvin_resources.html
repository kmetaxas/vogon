<div id="marvin-resources-panel">
    <h3 class="card-title" style="margin-top: 0;">Attached Resources</h3>
    {% if attached_resources %}
    <ul style="list-style: none; padding: 0; margin: 0;">
        {% for res in attached_resources %}
        <li style="display: flex; justify-content: space-between; align-items: center; padding: var(--spacing-sm) 0; border-bottom: 1px solid var(--color-border);">
            <div>
                <strong>{{ res.name }}</strong>
                <span class="session-item-meta">{{ res.resource_type.display_name }}</span>
            </div>
            <form method="post" action="{% url 'marvins:marvin-detach-resource' marvin.id %}"
                  hx-post="{% url 'marvins:marvin-detach-resource' marvin.id %}"
                  hx-target="#marvin-resources-panel"
                  hx-swap="outerHTML">
                {% csrf_token %}
                <input type="hidden" name="resource_id" value="{{ res.id }}">
                <button type="submit" class="btn btn-secondary" style="font-size: 0.75rem; padding: var(--spacing-xs) var(--spacing-sm);">Detach</button>
            </form>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p class="empty-state">No resources attached.</p>
    {% endif %}

    {% if available_resources %}
    <form method="post" action="{% url 'marvins:marvin-attach-resource' marvin.id %}"
          hx-post="{% url 'marvins:marvin-attach-resource' marvin.id %}"
          hx-target="#marvin-resources-panel"
          hx-swap="outerHTML"
          style="margin-top: var(--spacing-md);">
        {% csrf_token %}
        <div style="display: flex; gap: var(--spacing-sm);">
            <select name="resource_id" required
                    style="flex: 1; padding: var(--spacing-sm); border: 1px solid var(--color-border); border-radius: var(--radius);">
                <option value="">-- Attach a resource --</option>
                {% for res in available_resources %}
                <option value="{{ res.id }}">{{ res.name }} ({{ res.resource_type.display_name }})</option>
                {% endfor %}
            </select>
            <button type="submit" class="btn btn-primary">Attach</button>
        </div>
    </form>
    {% endif %}
</div>
