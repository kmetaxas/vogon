[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vogon"
version = "0.1.0"
description = "Vogon control plane for AI troubleshooting service"
requires-python = ">=3.11"
dependencies = [
  "django>=5.0,<6.0",
  "djangorestframework>=3.14",
  "django-allauth>=0.60",
  "uvicorn[standard]>=0.25",
  "whitenoise>=6.0",
  "grpcio>=1.60",
  "grpcio-tools>=1.60",
  "temporalio>=1.5",
  "fastmcp>=0.2",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "openai>=1.0",
  "httpx>=0.27",
  "psycopg[binary]>=3.1",
  "pgvector>=0.3",
  "markdown>=3.5",
  "nh3>=0.2",
  "pygments>=2.17",
  "channels[daphne]>=4.0",
  "channels-postgres>=1.1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-django>=4.7",
  "pytest-asyncio>=0.23",
  "black>=24.0",
  "ruff>=0.2",
  "mypy>=1.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vogon*", "apps*", "services*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP"]
[tool.ruff.lint]
select = ["E", "F", "I"] # Ensure 'I' is included for isort

[tool.pytest.ini_options]
norecursedirs = ["scripts", ".omo", "designs"]
testpaths = ["apps", "services"]
DJANGO_SETTINGS_MODULE = "vogon.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "vogon.settings"
