[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vogon"
version = "0.1.0"
description = "Vogon control plane for AI troubleshooting service"
requires-python = ">=3.11"
dependencies = [
  "django>=5.0,<6.0",
  "djangorestframework>=3.14",
  "django-allauth>=0.60",
  "uvicorn[standard]>=0.25",
  "whitenoise>=6.0",
  "grpcio>=1.60",
  "grpcio-tools>=1.60",
  "temporalio>=1.5",
  "fastmcp>=0.2",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "openai>=1.0",
  "httpx>=0.27",
  "psycopg[binary]>=3.1",
  "pgvector>=0.3",
  "markdown>=3.5",
  "nh3>=0.2",
  "pygments>=2.17",
  "channels[daphne]>=4.0",
  "channels-postgres>=1.1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-django>=4.7",
  "pytest-asyncio>=0.23",
  "black>=24.0",
  "ruff>=0.2",
  "mypy>=1.8",
  "django-stubs>=4.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vogon*", "apps*", "services*"]

[tool.black]
line-length = 100
target-version = ['py311']
extend-exclude = "(marvin_pb2|marvin_pb2_grpc)\\.py"

[tool.ruff]
line-length = 100
exclude = ["**/migrations/**", "marvin_pb2*.py", "scripts/", "typings/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W"]

[tool.pytest.ini_options]
norecursedirs = ["scripts", ".omo", "designs"]
testpaths = ["apps", "services"]
DJANGO_SETTINGS_MODULE = "vogon.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true

exclude = [
    "migrations",
    "scripts",
    "marvin_pb2",
    "typings",
]

[[tool.mypy.overrides]]
module = [
    "apps.core.models",
    "apps.core.admin",
    "apps.core.tests",
    "apps.core.middleware",
    "apps.core.mixins",
    "apps.core.views",
    "apps.marvins.models",
    "apps.marvins.admin",
    "apps.marvins.auth",
    "apps.marvins.config_assembly",
    "apps.marvins.tests",
    "apps.marvins.fields",
    "apps.sessions.models",
    "apps.sessions.admin",
    "apps.sessions.temporal_utils",
    "apps.sessions.api_views",
    "apps.sessions.urls",
    "apps.llm.models",
    "apps.llm.admin",
    "apps.llm.api_views",
    "apps.infradesigns.models",
    "apps.infradesigns.admin",
    "apps.infradesigns.urls",
    "apps.ws.*",
    "vogon.urls",
    "vogon.api_urls",
    "vogon.asgi",
    "services.standard_tools.architecture",
    "services.standard_tools.prometheus",
    "services.embeddings.generator",
    "services.mcp_server.auth",
    "services.mcp_server.server",
    "services.temporal_workers.workflows",
    "services.temporal_workers.activities",
    "services.grpc_server.servicer",
    "apps.marvins.discovery",
]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "vogon.settings"
